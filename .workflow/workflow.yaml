# yaml-language-server: $schema=../workflow.schema.yaml
# Recipe data only: core Skills do not depend on these named methodologies.
id: grill-me-superpowers-trial
default_delegation: inline
default_on_blocked: ask_user
default_invocation: compose
model: host_default
reasoning_effort: host_default

# Start once with $project-workflow. `compose` means the parent workflow reads
# and applies the named Skill's instructions; the user never invokes these steps.
steps:
  - id: clarify-with-grilling
    execution: sequential
    completion: all_required
    delegation: inline
    inputs: [user-request]
    on_success: plan-with-writing-plans
    on_blocked: ask_user
    skills:
      - name: grilling
        role: primary
        invocation: compose

  - id: plan-with-writing-plans
    execution: sequential
    completion: all_required
    delegation: inline
    inputs: [clarify-with-grilling]
    on_success: complete
    on_blocked: ask_user
    skills:
      - name: writing-plans
        role: primary
        invocation: compose
        model: inherit
        reasoning_effort: inherit
