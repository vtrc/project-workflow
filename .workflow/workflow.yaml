# yaml-language-server: $schema=../workflow.schema.yaml
# Recipe data only: Skills are loaded by the delegated Step runner.
id: grill-me-superpowers-trial
default_delegation: subagent
model: host_default
reasoning_effort: host_default

steps:
  - id: clarify-with-grilling
    inputs: []
    skills:
      - name: grilling
        role: primary

  - id: plan-with-writing-plans
    inputs: [clarify-with-grilling]
    prompt: Turn the clarified requirements into an actionable plan.
    skills:
      - name: writing-plans
        role: primary

  - id: review-with-grilling
    inputs: [clarify-with-grilling]
    skills:
      - name: grilling
        role: supporting
      - name: writing-plans
        role: primary
