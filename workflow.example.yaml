# Copy this template to .workflow/workflow.yaml before editing.
# yaml-language-server: $schema=../workflow.schema.yaml
# Replace placeholder Skill names with Skills installed in the consuming project.
id: my-personal-workflow
default_delegation: subagent
model: host_default
reasoning_effort: host_default

steps:
  - id: first-step
    inputs: []
    skills:
      - name: my-clarification-skill
        role: primary

  - id: second-step
    inputs: [first-step]
    prompt: Turn the first artifact into an actionable plan.
    skills:
      - name: my-planning-skill
        role: primary

  - id: review-step
    inputs: [first-step]
    skills:
      - name: my-review-skill
        role: primary
