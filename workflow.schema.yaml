$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.invalid/workflow.schema.yaml
title: Agent Skills workflow recipe
description: >-
  Structural schema for a project-local workflow whose Steps form an explicit
  dependency graph. Runtime status and artifact history remain registry-owned.
type: object
additionalProperties: false
required:
  - id
  - default_delegation
  - model
  - reasoning_effort
  - steps
properties:
  id:
    $ref: '#/$defs/nonEmptyId'
    description: Stable identifier for this workflow recipe.
  default_delegation:
    $ref: '#/$defs/delegation'
    description: Delegation policy inherited by Steps without delegation.
    default: subagent
  model:
    $ref: '#/$defs/model'
    description: Workflow-level host model intent.
    default: host_default
  reasoning_effort:
    $ref: '#/$defs/reasoningEffort'
    description: Workflow-level host reasoning intent.
    default: host_default
  steps:
    type: array
    minItems: 0
    description: Ordered Step declarations in dependency order.
    items:
      $ref: '#/$defs/step'

$defs:
  nonEmptyId:
    type: string
    minLength: 1
    description: Non-empty recipe or Step identifier.
  model:
    type: string
    minLength: 1
    description: Host model intent; the host interprets supported values.
    examples:
      - host_default
      - inherit
      - gpt-5.6-sol
  reasoningEffort:
    type: string
    minLength: 1
    description: Host reasoning intent; the host interprets supported values.
    examples:
      - host_default
      - inherit
      - high
  delegation:
    type: string
    enum:
      - inline
      - subagent
      - auto
    description: Step delegation policy interpreted by the host.
  role:
    type: string
    enum:
      - primary
      - supporting
      - review
    description: Skill responsibility within the delegated Step.
  step:
    type: object
    additionalProperties: false
    required:
      - id
      - inputs
      - skills
    properties:
      id:
        $ref: '#/$defs/nonEmptyId'
        description: Unique Step identifier and derived artifact ID.
      inputs:
        type: array
        minItems: 0
        uniqueItems: true
        items:
          $ref: '#/$defs/nonEmptyId'
        description: Preceding Step IDs whose ready artifacts this Step consumes.
      prompt:
        type: string
        minLength: 1
        description: Optional context supplied to the delegated Step runner.
      model:
        $ref: '#/$defs/model'
        description: Optional Step-level model override.
      reasoning_effort:
        $ref: '#/$defs/reasoningEffort'
        description: Optional Step-level reasoning override.
      delegation:
        $ref: '#/$defs/delegation'
        description: Optional Step-level delegation override.
      skills:
        type: array
        minItems: 1
        description: Skills loaded by the delegated Step runner.
        items:
          $ref: '#/$defs/binding'
  binding:
    type: object
    additionalProperties: false
    required:
      - name
      - role
    properties:
      name:
        $ref: '#/$defs/nonEmptyId'
        description: Exact local Skill name.
      role:
        $ref: '#/$defs/role'
